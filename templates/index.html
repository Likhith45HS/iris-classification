<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iris Flower Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f8fc; color: #1f2937; }
    .container { max-width: 520px; margin: 0 auto; padding: 24px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,0.08); }
    h1 { margin-bottom: 16px; font-size: 28px; color: #0f172a; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 20px; padding: 14px; border-radius: 8px; background: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Iris Flower Predictor</h1>
    <div>
      <label for="sepal_length">Sepal Length</label>
      <input id="sepal_length" type="number" step="0.1" value="5.1" />
      <label for="sepal_width">Sepal Width</label>
      <input id="sepal_width" type="number" step="0.1" value="3.5" />
      <label for="petal_length">Petal Length</label>
      <input id="petal_length" type="number" step="0.1" value="1.4" />
      <label for="petal_width">Petal Width</label>
      <input id="petal_width" type="number" step="0.1" value="0.2" />
      <button id="predictBtn">Predict Iris Type</button>
    </div>
    <div id="result" class="result">Enter values and click Predict.</div>
  </div>
  <script>
    document.getElementById('predictBtn').addEventListener('click', async () => {
      const features = [
        parseFloat(document.getElementById('sepal_length').value),
        parseFloat(document.getElementById('sepal_width').value),
        parseFloat(document.getElementById('petal_length').value),
        parseFloat(document.getElementById('petal_width').value)
      ];
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Predicting...';
      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ features })
        });
        const data = await response.json();
        if (response.ok) {
          resultEl.textContent = 'Prediction: ' + data.prediction;
        } else {
          resultEl.textContent = 'Error: ' + (data.error || 'Unknown error');
        }
      } catch (error) {
        resultEl.textContent = 'Request failed: ' + error.message;
      }
    });
  </script>
</body>
</html>
